<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEEDGENERATOR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <img src="imagenes/cofre.jpg" alt="logo">
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="producto.html">Personalizado</a></li>
        <li><a href="login.html">Iniciar Sesión</a></li>
        <li><a href="FAQ.html">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="banner">
      <div class="contenidoBanner">
        <h1>GENERÁ TUS PROPIAS SEEDS PERSONALIZADAS COMO A VOS MÁS TE GUSTE</h1>
      </div>
    </section>

    <div class="section-divider"></div>

    <section class="formularioProducto">
      <h2>Personalizá tu Seed</h2>
      <div class="contenidoForm">
        <form>
          <div>
            <label for="bioma">Bioma de spawn:</label>
            <select class="opcionesProducto" id="bioma" name="bioma">
              <option>Bosque</option>
              <option>Desierto</option>
              <option>Jungla</option>
              <option>Pantano</option>
              <option>Sabana</option>
              <option>Tundra</option>
              <option>Taiga</option>
              <option>Montaña</option>
              <option>Océano</option>
              <option>Mesa</option>
              <option>Llanura</option>
            </select>
          </div>

          <div>
            <label for="distanciaEnd">Distancia al portal al End:</label>
            <select class="opcionesProducto" id="distanciaEnd" name="distanciaEnd">
              <option>0-100 bloques</option>
              <option>100-500 bloques</option>
              <option>500-1000 bloques</option>
              <option>1000-2000 bloques</option>
              <option>2000-5000 bloques</option>
              <option>5000+ bloques</option>
            </select>
          </div>

          <div>
            <label for="spawnAldea">Spawn en aldea:</label>
            <select class="opcionesProducto" id="spawnAldea" name="spawnAldea">
              <option>Sí</option>
              <option>No</option>
            </select>
          </div>

          <div>
            <label for="distanciaAncient">Distancia al Ancient City:</label>
            <select class="opcionesProducto" id="distanciaAncient" name="distanciaAncient">
              <option>0-100 bloques</option>
              <option>100-500 bloques</option>
              <option>500-1000 bloques</option>
              <option>1000-2000 bloques</option>
              <option>2000-5000 bloques</option>
              <option>5000+ bloques</option>
            </select>
          </div>

          <button type="submit" class="botonSecundario">GENERAR MI SEED PERSONALIZADA</button>
        </form>
      </div>
    </section>

  </main>

  <footer>
    <h2>ALL COPYRIGHT BELONGS TO SZUCHET &amp; DIAZ ASOCIATION SRL CO. ©</h2>
  </footer>

</body>
</html>
